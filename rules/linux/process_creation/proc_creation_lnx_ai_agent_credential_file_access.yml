title: AI Coding Agent Shell Command Accessing Credential Files
id: 12588adb-3374-4b4e-809a-e1df9af0e990
status: experimental
description: |
    Detects a shell command run by an AI coding agent (Claude Code, Codex CLI, opencode, Gemini CLI and similar) that references SSH private keys, cloud credentials, token files or desktop keyrings.
    A coding agent rarely needs these files. A match can mean the agent was steered by prompt injection in a repository, issue or web page, or that it is going further than the user intended.
    Part of the AI coding agent pack; see documentation/ai-coding-agents/README.md for the log source setup it assumes.
references:
    - https://github.com/anthropics/claude-code
    - https://github.com/openai/codex
    - https://github.com/sst/opencode
    - https://github.com/google-gemini/gemini-cli
    - https://attack.mitre.org/techniques/T1552/004/
author: Mark Briers
date: 2026-10-25
tags:
    - attack.credential-access
    - attack.t1552.001
    - attack.t1552.004
logsource:
    category: process_creation
    product: linux
detection:
    # Agent identification. Coding agents run tool commands through a shell (bash -c, bash -lc or sh -c),
    # so the command text shows up in the CommandLine of the shell and the agent is the ParentImage.
    selection_agent_parent_image:
        ParentImage|endswith:
            - '/claude'
            - '/codex'
            - '/crush'
            - '/cursor-agent'
            - '/goose'
            - '/opencode'
    selection_agent_parent_path:
        ParentImage|contains: '/claude/versions/' # Claude Code native install keeps one binary per version under ~/.local/share/claude/versions/
    selection_agent_parent_cli:
        # Agents installed from npm or pip run under node or python, so the parent image alone does not identify them
        ParentCommandLine|contains:
            - '@anthropic-ai/claude-code'
            - '@google/gemini-cli'
            - '@openai/codex'
            - '@sourcegraph/amp'
            - '/bin/aider'
            - '/bin/gemini'
            - 'codex-linux-sandbox'
            - 'opencode-ai'
    selection_agent_snapshot:
        CommandLine|contains: '/.claude/shell-snapshots/' # Claude Code sources a shell snapshot before each Bash tool command
    selection_target:
        CommandLine|contains:
            - '/.aws/credentials'
            - '/.azure/'
            - '/.config/gcloud/'
            - '/.config/gh/hosts.yml'
            - '/.docker/config.json'
            - '/.git-credentials'
            - '/.gnupg/private-keys'
            - '/.kube/config'
            - '/.local/share/keyrings/'
            - '/.netrc'
            - '/.npmrc'
            - '/.password-store/'
            - '/.pypirc'
            - '/.ssh/id_'
            - '/.vault-token'
            - '/etc/shadow'
    condition: 1 of selection_agent_* and selection_target
falsepositives:
    - The user asks the agent to set up SSH, Git or cloud CLI access, for example reading a public key ending in ".pub"
    - Agents working on dotfile repositories
level: medium
