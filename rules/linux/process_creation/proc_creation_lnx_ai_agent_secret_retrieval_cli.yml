title: AI Coding Agent Shell Command Retrieving Secrets Via CLI
id: a1af06b7-9523-4608-88da-d031bad9100f
status: experimental
description: |
    Detects a shell command run by an AI coding agent that prints a token or secret through a credential CLI (GitHub CLI, libsecret, pass, 1Password, cloud CLIs, git credential helpers) or reads a process environment from /proc.
    Part of the AI coding agent pack; see documentation/ai-coding-agents/README.md for the log source setup it assumes.
references:
    - https://github.com/anthropics/claude-code
    - https://github.com/openai/codex
    - https://github.com/sst/opencode
    - https://github.com/google-gemini/gemini-cli
    - https://attack.mitre.org/techniques/T1528/
    - https://attack.mitre.org/techniques/T1555/
author: Mark Briers
date: 2026-10-25
tags:
    - attack.credential-access
    - attack.t1528
    - attack.t1555
logsource:
    category: process_creation
    product: linux
detection:
    # Agent identification. Coding agents run tool commands through a shell (bash -c, bash -lc or sh -c),
    # so the command text shows up in the CommandLine of the shell and the agent is the ParentImage.
    selection_agent_parent_image:
        ParentImage|endswith:
            - '/claude'
            - '/codex'
            - '/crush'
            - '/cursor-agent'
            - '/goose'
            - '/opencode'
    selection_agent_parent_path:
        ParentImage|contains: '/claude/versions/' # Claude Code native install keeps one binary per version under ~/.local/share/claude/versions/
    selection_agent_parent_cli:
        # Agents installed from npm or pip run under node or python, so the parent image alone does not identify them
        ParentCommandLine|contains:
            - '@anthropic-ai/claude-code'
            - '@google/gemini-cli'
            - '@openai/codex'
            - '@sourcegraph/amp'
            - '/bin/aider'
            - '/bin/gemini'
            - 'codex-linux-sandbox'
            - 'opencode-ai'
    selection_agent_snapshot:
        CommandLine|contains: '/.claude/shell-snapshots/' # Claude Code sources a shell snapshot before each Bash tool command
    selection_cli:
        CommandLine|contains:
            - '/environ'
            - 'az account get-access-token'
            - 'aws configure export-credentials'
            - 'gcloud auth print-access-token'
            - 'gh auth token'
            - 'git credential fill'
            - 'kubectl config view --raw'
            - 'op://'
            - 'pass show '
            - 'secret-tool lookup'
            - 'secret-tool search'
    condition: 1 of selection_agent_* and selection_cli
falsepositives:
    - Scripts that pass a token from the GitHub CLI or a password manager to another tool at the user's request
level: medium
