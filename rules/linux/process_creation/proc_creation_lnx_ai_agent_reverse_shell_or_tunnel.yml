title: AI Coding Agent Shell Command Opening Reverse Shell Or Tunnel
id: 19ae0c6a-b568-45ee-8e40-2d7a5a690747
status: experimental
description: |
    Detects a shell command run by an AI coding agent that matches common reverse shell patterns or starts a tunnel that exposes the machine to the internet.
    Part of the AI coding agent pack; see documentation/ai-coding-agents/README.md for the log source setup it assumes.
references:
    - https://github.com/anthropics/claude-code
    - https://github.com/openai/codex
    - https://github.com/sst/opencode
    - https://github.com/google-gemini/gemini-cli
    - https://attack.mitre.org/techniques/T1059/004/
    - https://attack.mitre.org/techniques/T1572/
author: Mark Briers
date: 2026-10-25
tags:
    - attack.execution
    - attack.t1059.004
    - attack.command-and-control
    - attack.t1095
    - attack.t1572
logsource:
    category: process_creation
    product: linux
detection:
    # Agent identification. Coding agents run tool commands through a shell (bash -c, bash -lc or sh -c),
    # so the command text shows up in the CommandLine of the shell and the agent is the ParentImage.
    selection_agent_parent_image:
        ParentImage|endswith:
            - '/claude'
            - '/codex'
            - '/crush'
            - '/cursor-agent'
            - '/goose'
            - '/opencode'
    selection_agent_parent_path:
        ParentImage|contains: '/claude/versions/' # Claude Code native install keeps one binary per version under ~/.local/share/claude/versions/
    selection_agent_parent_cli:
        # Agents installed from npm or pip run under node or python, so the parent image alone does not identify them
        ParentCommandLine|contains:
            - '@anthropic-ai/claude-code'
            - '@google/gemini-cli'
            - '@openai/codex'
            - '@sourcegraph/amp'
            - '/bin/aider'
            - '/bin/gemini'
            - 'codex-linux-sandbox'
            - 'opencode-ai'
    selection_agent_snapshot:
        CommandLine|contains: '/.claude/shell-snapshots/' # Claude Code sources a shell snapshot before each Bash tool command
    selection_revshell:
        CommandLine|contains:
            - ' -e /bin/bash'
            - ' -e /bin/sh'
            - '/dev/tcp/'
            - '/dev/udp/'
            - 'bash -i'
            - 'exec:/bin/'
            - 'mkfifo '
            - 'nc -c '
            - 'nc -e '
            - 'ncat -c '
            - 'ncat -e '
            - 'pty.spawn'
            - 'socat exec:'
    selection_tunnel:
        CommandLine|contains:
            - 'bore local'
            - 'chisel client'
            - 'chisel server'
            - 'cloudflared tunnel'
            - 'localtonet'
            - 'ngrok '
            - 'ssh -R'
            - 'tailscale funnel'
    condition: 1 of selection_agent_* and (selection_revshell or selection_tunnel)
falsepositives:
    - The user asks the agent to expose a local development server through a tunnel
level: high
