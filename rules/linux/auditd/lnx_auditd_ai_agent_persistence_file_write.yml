title: AI Coding Agent Process Writing To Startup Or Login Files
id: d1552232-76a2-4f80-be4a-0786a0337609
status: experimental
description: |
    Detects an AI coding agent process (or the node or bun runtime it runs on) writing to files covered by the "ai_agent_persistence" audit watch: shell rc files, Hyprland and UWSM config, systemd user units, XDG autostart and SSH authorized_keys.
    This catches edits made through the agent's built-in edit tools, which do not start a shell.
    Requires the audit rules in documentation/ai-coding-agents/ai-agents.rules.
references:
    - https://github.com/anthropics/claude-code
    - https://github.com/openai/codex
    - https://github.com/sst/opencode
    - https://github.com/google-gemini/gemini-cli
    - https://man7.org/linux/man-pages/man7/audit.rules.7.html
author: Mark Briers
date: 2026-10-25
tags:
    - attack.persistence
    - attack.t1546.004
    - attack.t1543.002
    - attack.t1547.013
logsource:
    product: linux
    service: auditd
detection:
    selection_key:
        type: 'SYSCALL'
        key: 'ai_agent_persistence'
    selection_agent_exe:
        exe|endswith:
            - '/bun'
            - '/claude'
            - '/codex'
            - '/crush'
            - '/cursor-agent'
            - '/goose'
            - '/node'
            - '/opencode'
    selection_agent_exe_path:
        exe|contains: '/claude/versions/'
    condition: selection_key and 1 of selection_agent_*
falsepositives:
    - The user asks the agent to change their shell, Hyprland or systemd configuration
    - Agent installers that add a PATH entry to the shell rc file
level: medium
